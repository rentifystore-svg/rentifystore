<!DOCTYPE html>
<html>
<head>
    <title>Create Placeholder Images</title>
</head>
<body>
    <canvas id="canvas" width="280" height="560" style="display:none;"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create 10 different placeholder images
        const screens = [
            { text: 'Rentify', subtext: 'Use karo, kharidna zaruri nahi', color: '#00A86B' },
            { text: 'Welcome', subtext: 'Rent anything in Mumbai', color: '#4CAF50' },
            { text: 'Browse', subtext: 'Find items to rent', color: '#2196F3' },
            { text: 'Connect', subtext: 'Chat with owners', color: '#FF9800' },
            { text: 'Login', subtext: 'Sign in to continue', color: '#9C27B0' },
            { text: 'Home', subtext: 'Discover rentals', color: '#F44336' },
            { text: 'Map', subtext: 'Find nearby items', color: '#00BCD4' },
            { text: 'Listing', subtext: 'Item details', color: '#795548' },
            { text: 'Chat', subtext: 'Messages', color: '#607D8B' },
            { text: 'Profile', subtext: 'Your account', color: '#3F51B5' }
        ];
        
        screens.forEach((screen, index) => {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Header
            ctx.fillStyle = screen.color;
            ctx.fillRect(0, 0, canvas.width, 80);
            
            // Main content area
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 80, canvas.width, canvas.height - 160);
            
            // Footer
            ctx.fillStyle = screen.color;
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            // Text content
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(screen.text, canvas.width/2, 40);
            
            ctx.fillStyle = '#333333';
            ctx.font = '16px Arial';
            ctx.fillText(screen.subtext, canvas.width/2, canvas.height/2);
            
            // Status bar
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, 20);
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('9:41 AM', 10, 15);
            
            // Download the image
            const link = document.createElement('a');
            link.download = `screen${index + 1}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
        
        document.body.innerHTML = '<h1>Images created! Check your downloads folder.</h1>';
    </script>
</body>
</html>
